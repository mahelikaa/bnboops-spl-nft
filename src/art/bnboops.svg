<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2329"/>
      <stop offset="75%" stop-color="#0B0E11"/>
    </linearGradient>
    <radialGradient id="alarm" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3139"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="35%" stop-color="#FCD535"/>
      <stop offset="75%" stop-color="#F0B90B"/>
      <stop offset="100%" stop-color="#A87C07"/>
    </radialGradient>
    <linearGradient id="coinRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE47A"/>
      <stop offset="50%" stop-color="#C99400"/>
      <stop offset="100%" stop-color="#6E5003"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="60%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#6D0F0F"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD535"/>
      <stop offset="100%" stop-color="#D9A406"/>
    </linearGradient>
    <linearGradient id="glassInside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1416"/>
      <stop offset="100%" stop-color="#120708"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="45%" stop-color="#9AA3AE"/>
      <stop offset="100%" stop-color="#4A525C"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D3A1A"/>
      <stop offset="50%" stop-color="#A86B34"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9BE7A1"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2FCFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#A9DCF5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5FB3E0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D6340"/>
      <stop offset="100%" stop-color="#4E3320"/>
    </linearGradient>
    <linearGradient id="hazBag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD535" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0B90B" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="tape" width="60" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="60" height="40" fill="#F0B90B"/>
      <rect width="30" height="40" fill="#0B0E11"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="rimText" d="M300 470 m-148 0 a148 148 0 1 1 296 0 a148 148 0 1 1 -296 0"/>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#alarm)"/>
  <!-- faint exchange-chart grid -->
  <g stroke="#F0B90B" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="200" x2="1024" y2="200"/><line x1="0" y1="320" x2="1024" y2="320"/>
    <line x1="0" y1="440" x2="1024" y2="440"/><line x1="0" y1="560" x2="1024" y2="560"/>
    <line x1="160" y1="120" x2="160" y2="760"/><line x1="320" y1="120" x2="320" y2="760"/>
    <line x1="480" y1="120" x2="480" y2="760"/><line x1="640" y1="120" x2="640" y2="760"/>
    <line x1="800" y1="120" x2="800" y2="760"/>
  </g>

  <!-- title -->
  <text x="512" y="88" font-family="Arial Black, Impact, sans-serif" font-size="76" fill="#F0B90B" text-anchor="middle" filter="url(#shadow)">$BNBOOPS</text>
  <text x="512" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="8" fill="#EAECEF" text-anchor="middle">BIG NAUGHTY BREACH</text>

  <!-- floor -->
  <rect x="0" y="760" width="1024" height="264" fill="url(#floor)"/>
  <line x1="0" y1="760" x2="1024" y2="760" stroke="#474D57" stroke-width="3"/>

  <!-- ===== SAFU cabinet ===== -->
  <g filter="url(#shadow)">
    <rect x="610" y="160" width="350" height="500" rx="20" fill="url(#cabinet)" stroke="#4A0A0A" stroke-width="6"/>
    <rect x="622" y="172" width="326" height="476" rx="14" fill="none" stroke="#FF8A80" stroke-opacity="0.35" stroke-width="3"/>
  </g>
  <g fill="url(#steel)" stroke="#3a3f46" stroke-width="2">
    <circle cx="634" cy="184" r="8"/><circle cx="936" cy="184" r="8"/>
    <circle cx="634" cy="636" r="8"/><circle cx="936" cy="636" r="8"/>
  </g>
  <!-- header plate -->
  <rect x="645" y="190" width="280" height="68" rx="8" fill="url(#plate)" stroke="#8A6A00" stroke-width="3"/>
  <text x="785" y="237" font-family="Arial Black, Impact, sans-serif" font-size="40" fill="#0B0E11" text-anchor="middle">SAFU FUND</text>
  <!-- glass window -->
  <rect x="645" y="278" width="280" height="290" rx="6" fill="url(#glassInside)" stroke="#2b0b0b" stroke-width="5"/>
  <!-- contents: coin stacks + bills -->
  <g>
    <g transform="translate(700 520)">
      <ellipse cx="0" cy="30" rx="34" ry="10" fill="#8A6A00"/>
      <rect x="-34" y="-10" width="68" height="40" fill="#C99400"/>
      <ellipse cx="0" cy="-10" rx="34" ry="10" fill="#FCD535"/>
    </g>
    <g transform="translate(870 525)">
      <ellipse cx="0" cy="25" rx="30" ry="9" fill="#8A6A00"/>
      <rect x="-30" y="-25" width="60" height="50" fill="#C99400"/>
      <ellipse cx="0" cy="-25" rx="30" ry="9" fill="#FCD535"/>
    </g>
  </g>
  <!-- bills bursting out -->
  <g filter="url(#shadow)">
    <g transform="rotate(-22 760 420)">
      <rect x="715" y="400" width="96" height="46" rx="5" fill="url(#bill)" stroke="#1B5E20" stroke-width="3"/>
      <circle cx="763" cy="423" r="13" fill="none" stroke="#1B5E20" stroke-width="3"/>
    </g>
    <g transform="rotate(18 860 380)">
      <rect x="815" y="358" width="96" height="46" rx="5" fill="url(#bill)" stroke="#1B5E20" stroke-width="3"/>
      <circle cx="863" cy="381" r="13" fill="none" stroke="#1B5E20" stroke-width="3"/>
    </g>
    <g transform="rotate(-8 560 320)">
      <rect x="510" y="300" width="96" height="46" rx="5" fill="url(#bill)" stroke="#1B5E20" stroke-width="3"/>
      <circle cx="558" cy="323" r="13" fill="none" stroke="#1B5E20" stroke-width="3"/>
    </g>
    <circle cx="575" cy="420" r="22" fill="url(#coinFace)" stroke="#8A6A00" stroke-width="4"/>
  </g>
  <!-- shattered glass: radial + ring cracks from the impact point -->
  <g stroke="#EAF6FF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M700 330 L650 285"/><path d="M700 330 L760 282"/><path d="M700 330 L920 300"/>
    <path d="M700 330 L920 430"/><path d="M700 330 L820 565"/><path d="M700 330 L690 565"/>
    <path d="M700 330 L650 470"/>
    <path d="M672 306 Q700 292 728 304 Q752 330 730 356 Q700 372 676 356 Q658 332 672 306Z"/>
    <path d="M640 300 Q700 250 790 290 Q830 360 780 420 Q700 470 650 420"/>
  </g>
  <!-- glass reflection -->
  <path d="M655 560 L760 285 L790 285 L685 560Z" fill="#fff" opacity="0.07"/>
  <!-- impact flash -->
  <circle cx="700" cy="330" r="30" fill="#fff" opacity="0.5" filter="url(#glow)"/>
  <!-- flying shards -->
  <g fill="#EAF6FF" opacity="0.9" stroke="#9FD6FF" stroke-width="1.5">
    <path d="M610 250 l26 -14 l-8 28z"/><path d="M585 360 l22 6 l-18 16z"/>
    <path d="M620 470 l18 -16 l4 24z"/><path d="M560 250 l14 -6 l-2 16z"/>
  </g>
  <!-- cabinet label -->
  <text x="785" y="602" font-family="Arial Black, Impact, sans-serif" font-size="22" fill="#fff" text-anchor="middle">IN CASE OF OOPS</text>
  <text x="785" y="630" font-family="Arial Black, Impact, sans-serif" font-size="22" fill="#FCD535" text-anchor="middle">BREAK GLASS</text>

  <!-- ===== the coin ===== -->
  <ellipse cx="300" cy="700" rx="170" ry="26" fill="#000" opacity="0.45"/>
  <g filter="url(#shadow)">
    <circle cx="300" cy="470" r="190" fill="url(#coinRim)"/>
    <circle cx="300" cy="470" r="190" fill="none" stroke="#8A6A00" stroke-width="10" stroke-dasharray="4 6"/>
    <circle cx="300" cy="470" r="168" fill="url(#coinFace)" stroke="#8A6A00" stroke-width="4"/>
    <circle cx="300" cy="470" r="128" fill="none" stroke="#C99400" stroke-width="3"/>
  </g>
  <text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" letter-spacing="3" fill="#8A6A00">
    <textPath xlink:href="#rimText" href="#rimText">SAFU • PROBABLY • SAFU • PROBABLY • SAFU • PROBABLY •</textPath>
  </text>
  <!-- specular highlight -->
  <ellipse cx="245" cy="380" rx="70" ry="36" fill="#fff" opacity="0.28" transform="rotate(-30 245 380)"/>
  <!-- crack + bandage -->
  <path d="M220 320 L250 375 L228 408 L262 455" fill="none" stroke="#5A4105" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(-35 225 385)" filter="url(#shadow)">
    <rect x="175" y="368" width="110" height="36" rx="16" fill="#F4C7A1" stroke="#A0704A" stroke-width="3"/>
    <rect x="213" y="368" width="34" height="36" fill="#E8B48A"/>
    <g fill="#A0704A"><circle cx="222" cy="378" r="2.5"/><circle cx="238" cy="378" r="2.5"/><circle cx="222" cy="394" r="2.5"/><circle cx="238" cy="394" r="2.5"/></g>
  </g>
  <!-- face: focused, a bit sweaty -->
  <ellipse cx="258" cy="470" rx="30" ry="36" fill="#fff" stroke="#3B2A02" stroke-width="5"/>
  <circle cx="272" cy="468" r="12" fill="#1E2329"/><circle cx="276" cy="463" r="4" fill="#fff"/>
  <ellipse cx="350" cy="470" rx="30" ry="36" fill="#fff" stroke="#3B2A02" stroke-width="5"/>
  <circle cx="364" cy="468" r="12" fill="#1E2329"/><circle cx="368" cy="463" r="4" fill="#fff"/>
  <path d="M226 424 L286 440" stroke="#3B2A02" stroke-width="7" stroke-linecap="round"/>
  <path d="M382 424 L322 440" stroke="#3B2A02" stroke-width="7" stroke-linecap="round"/>
  <path d="M262 548 Q304 572 346 544" fill="none" stroke="#3B2A02" stroke-width="7" stroke-linecap="round"/>
  <path d="M408 380 q-14 24 0 36 q14 -12 0 -36z" fill="#7FD6FF"/>
  <path d="M190 470 q-12 20 0 30 q12 -10 0 -30z" fill="#7FD6FF"/>

  <!-- arm + realistic hammer mid-swing -->
  <path d="M478 430 Q520 410 560 395" fill="none" stroke="#3B2A02" stroke-width="13" stroke-linecap="round"/>
  <!-- handle runs from the hand up to the head, which lands on the glass -->
  <g filter="url(#shadow)">
    <line x1="560" y1="395" x2="672" y2="338" stroke="#3E2510" stroke-width="24" stroke-linecap="round"/>
    <line x1="560" y1="395" x2="672" y2="338" stroke="url(#wood)" stroke-width="18" stroke-linecap="round"/>
    <g transform="rotate(-27 690 330)">
      <rect x="664" y="284" width="52" height="96" rx="7" fill="url(#steel)" stroke="#2F353C" stroke-width="3"/>
      <rect x="664" y="284" width="14" height="96" rx="5" fill="#fff" opacity="0.35"/>
    </g>
  </g>
  <circle cx="560" cy="395" r="13" fill="#3B2A02"/>
  <!-- motion lines -->
  <g stroke="#EAECEF" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M560 270 q40 -10 80 10"/><path d="M548 300 q36 -6 70 12"/>
  </g>

  <!-- ===== quarantined DevOps laptop (bottom left) ===== -->
  <g filter="url(#shadow)">
    <path d="M40 870 Q30 760 90 720 L270 720 Q320 760 300 870 Q170 900 40 870Z" fill="url(#hazBag)" stroke="#F0B90B" stroke-width="4"/>
  </g>
  <g transform="rotate(-6 170 800)">
    <rect x="95" y="745" width="150" height="96" rx="8" fill="#2B3139" stroke="#0B0E11" stroke-width="4"/>
    <rect x="106" y="756" width="128" height="70" rx="3" fill="#0d1410"/>
    <text x="170" y="784" font-family="Menlo, Courier New, monospace" font-size="15" fill="#F6465D" text-anchor="middle">COMPROMISED</text>
    <text x="170" y="808" font-family="Menlo, Courier New, monospace" font-size="13" fill="#0ECB81" text-anchor="middle">devops@prod $ _</text>
    <rect x="135" y="830" width="70" height="16" rx="8" fill="#F6465D"/>
    <text x="170" y="842" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">DevOps</text>
  </g>
  <path d="M150 712 Q170 690 190 712" fill="none" stroke="#F0B90B" stroke-width="6"/>
  <rect x="58" y="880" width="232" height="34" rx="4" fill="url(#tape)"/>
  <rect x="96" y="884" width="156" height="26" rx="3" fill="#0B0E11"/>
  <text x="174" y="903" font-family="Arial Black, Impact, sans-serif" font-size="16" fill="#F0B90B" text-anchor="middle">QUARANTINE</text>
  <g fill="none" stroke="#0ECB81" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M120 700 q-10 -16 0 -32 q10 -16 0 -32"/><path d="M230 700 q-10 -16 0 -32 q10 -16 0 -32"/>
  </g>

  <!-- ===== frozen loot (bottom middle) ===== -->
  <ellipse cx="520" cy="880" rx="110" ry="16" fill="#000" opacity="0.4"/>
  <g filter="url(#shadow)">
    <rect x="420" y="720" width="200" height="160" rx="14" fill="url(#ice)" stroke="#E6F7FF" stroke-width="4"/>
  </g>
  <g transform="translate(520 775) scale(0.85)">
    <path d="M-48 -26 Q-64 62 0 68 Q64 62 48 -26 Q22 -40 0 -32 Q-22 -40 -48 -26Z" fill="url(#bag)" stroke="#2B1C0E" stroke-width="4" opacity="0.85"/>
    <path d="M-22 -36 Q0 -62 22 -36" fill="none" stroke="#2B1C0E" stroke-width="6" opacity="0.85"/>
    <text x="0" y="40" font-family="Arial Black, Impact, sans-serif" font-size="48" fill="#F0B90B" text-anchor="middle" opacity="0.9">$</text>
  </g>
  <path d="M436 738 L486 738 M436 756 L466 756" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M420 780 L620 760" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <rect x="448" y="846" width="144" height="28" rx="14" fill="#0B3556" opacity="0.85"/>
  <text x="520" y="867" font-family="Arial Black, Impact, sans-serif" font-size="18" fill="#E6F7FF" text-anchor="middle">$3B FROZEN</text>

  <!-- ===== users covered stamp ===== -->
  <g transform="rotate(-9 820 800)" opacity="0.95">
    <rect x="680" y="745" width="290" height="104" rx="12" fill="none" stroke="#0ECB81" stroke-width="7"/>
    <rect x="690" y="755" width="270" height="84" rx="8" fill="none" stroke="#0ECB81" stroke-width="2"/>
    <text x="825" y="795" font-family="Arial Black, Impact, sans-serif" font-size="25" fill="#0ECB81" text-anchor="middle">USERS: COVERED</text>
    <text x="825" y="826" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0ECB81" text-anchor="middle">✔ (reportedly)</text>
  </g>

  <!-- tagline -->
  <rect x="122" y="944" width="780" height="60" rx="30" fill="#F0B90B"/>
  <text x="512" y="986" font-family="Arial Black, Impact, sans-serif" font-size="36" fill="#0B0E11" text-anchor="middle">IN CASE OF OOPS, BREAK GLASS</text>
</svg>
